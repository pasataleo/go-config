name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make tidy
      - run: make generate
      - run: make fmt

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git status --short
            echo "::error::make tidy, generate or fmt changed files, run make all and commit the changes"
            exit 1
          fi

      - run: make lint
      - run: make test
      - run: make build
